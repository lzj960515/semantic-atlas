name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.12.0"
            package-manager: npm
          - node: "24"
            package-manager: pnpm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - run: node node_modules/tsx/dist/cli.mjs scripts/generate-contracts.ts --check
      - run: node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Run source tests
        if: ${{ matrix.node == '24' }}
        run: node node_modules/vitest/vitest.mjs run
      - name: Run portable source tests
        if: ${{ matrix.node == '22.12.0' }}
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/contracts/public-contracts.spec.ts
          tests/evaluation/contracts.spec.ts
          tests/repository/repository-inspector.spec.ts
          tests/skill/semantic-atlas-skill.spec.ts
          tests/snapshots/repository-snapshot.spec.ts
      - name: Run installed-package tests and verification
        run: node node_modules/tsx/dist/cli.mjs scripts/verify-package.ts
        env:
          SEMANTIC_ATLAS_PACKAGE_MANAGER: ${{ matrix.package-manager }}

  cli-smoke:
    name: Installed CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:verify
