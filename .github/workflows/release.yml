name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module --eval
          "import { readFileSync } from 'node:fs';
          const packageDocument = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== 'v' + packageDocument.version)
          throw new Error('Release tag must match package version');"
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:verify
      - run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
